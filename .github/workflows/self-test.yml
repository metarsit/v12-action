# Runs the action for real against the tiny fixture project with the
# repository's V12 token: a full audit of test/fixtures/sample-project/
# (fixed price, a few cents) on every push to main and weekly. Documented
# recurring spend: roughly one small audit per week plus one per merged
# pull request.
name: Self-test (real V12 run)

on:
  push:
    branches: [main]
    paths: ['action.yml', 'scripts/**', 'test/fixtures/sample-project/**', '.github/workflows/self-test.yml']
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: self-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./ # zizmor: ignore[self-repository] the ./ form is understood by every runner version
        id: audit
        with:
          v12-token: ${{ secrets.V12_TOKEN }}
          mode: full
          name: v12-action self-test
          paths: test/fixtures/sample-project/
          max-cost-cents: 500
          wait-timeout-minutes: 60
          check-run-name: V12 self-test
          fail-on: none
      - name: Assert the run completed and reported
        env:
          STATE: ${{ steps.audit.outputs.state }}
          CONCLUSION: ${{ steps.audit.outputs.conclusion }}
          TOTAL: ${{ steps.audit.outputs.total-count }}
          COST: ${{ steps.audit.outputs.cost-cents }}
          RUN_URL: ${{ steps.audit.outputs.run-url }}
          SARIF: ${{ steps.audit.outputs.sarif-path }}
        run: |
          set -euo pipefail
          echo "state=$STATE conclusion=$CONCLUSION findings=$TOTAL cost-cents=$COST run=$RUN_URL"
          [ "$STATE" = "completed" ] || { echo "::error::expected a completed run"; exit 1; }
          [ -s "$SARIF" ] || { echo "::error::expected a SARIF file"; exit 1; }
          python3 - "$SARIF" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["version"] == "2.1.0" and doc["runs"][0]["tool"]["driver"]["name"] == "V12"
          print("SARIF ok:", len(doc["runs"][0]["results"]), "results")
          PY
